<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Chinese B SL 备考神助攻 | 交互分类词汇表</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #151c2c;
            --surface-hover: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --primary: #3b82f6;
            
            /* Theme Color Accents */
            --identities-color: #10b981;
            --identities-bg: rgba(16, 185, 129, 0.1);
            --experiences-color: #f59e0b;
            --experiences-bg: rgba(245, 158, 11, 0.1);
            --ingenuity-color: #06b6d4;
            --ingenuity-bg: rgba(6, 182, 212, 0.1);
            --organization-color: #f97316;
            --organization-bg: rgba(249, 115, 22, 0.1);
            --planet-color: #84cc16;
            --planet-bg: rgba(132, 204, 22, 0.1);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --primary: #2563eb;
            
            --identities-bg: rgba(16, 185, 129, 0.15);
            --experiences-bg: rgba(245, 158, 11, 0.15);
            --ingenuity-bg: rgba(6, 182, 212, 0.15);
            --organization-bg: rgba(249, 115, 22, 0.15);
            --planet-bg: rgba(132, 204, 22, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Ambient Glow in Background */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(0,0,0,0) 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-left {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.05) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
            z-index: 0;
        }

        /* Navigation Layout */
        header {
            background-color: rgba(21, 28, 44, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s;
        }

        [data-theme="light"] header {
            background-color: rgba(255, 255, 255, 0.8);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 1.75rem;
        }

        .logo-text h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        nav {
            display: flex;
            gap: 0.5rem;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            background-color: var(--surface-hover);
        }

        .nav-btn.active {
            color: var(--text-primary);
            background-color: var(--primary);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .theme-toggle-btn:hover {
            background-color: var(--surface-hover);
        }

        /* Container Main */
        main {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 10;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Views management */
        .view-section {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .view-section.active {
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: translateY(0);
        }

        /* Global Stats Bar */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-icon {
            position: absolute;
            font-size: 3rem;
            right: 0.5rem;
            bottom: 0.25rem;
            opacity: 0.06;
            color: var(--text-primary);
        }

        /* Theme Cards Grid */
        .themes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .themes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .theme-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .theme-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            border-top-left-radius: 1.25rem;
            border-top-right-radius: 1.25rem;
        }

        /* Theme Accents mapping */
        .theme-card[data-theme-idx="0"]::before { background-color: var(--identities-color); }
        .theme-card[data-theme-idx="1"]::before { background-color: var(--experiences-color); }
        .theme-card[data-theme-idx="2"]::before { background-color: var(--ingenuity-color); }
        .theme-card[data-theme-idx="3"]::before { background-color: var(--organization-color); }
        .theme-card[data-theme-idx="4"]::before { background-color: var(--planet-color); }

        .theme-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-card-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .theme-progress {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            width: 100px;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .theme-card[data-theme-idx="0"] .progress-bar-fill { background-color: var(--identities-color); }
        .theme-card[data-theme-idx="1"] .progress-bar-fill { background-color: var(--experiences-color); }
        .theme-card[data-theme-idx="2"] .progress-bar-fill { background-color: var(--ingenuity-color); }
        .theme-card[data-theme-idx="3"] .progress-bar-fill { background-color: var(--organization-color); }
        .theme-card[data-theme-idx="4"] .progress-bar-fill { background-color: var(--planet-color); }

        .theme-card-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .theme-card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .theme-subtopics-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .subtopic-badge {
            background-color: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .subtopic-badge:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .theme-card-footer {
            margin-top: auto;
            display: flex;
            gap: 1rem;
        }

        .btn {
            background-color: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
            flex: 1;
        }

        .btn:hover {
            background-color: var(--border-color);
        }

        .btn-primary {
            background-color: var(--primary);
            border: none;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .btn-primary:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }

        /* Vocabulary Browser styling */
        .browser-filter-bar {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .browser-filter-bar {
                grid-template-columns: 2fr 1fr 1fr;
            }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 0.5rem;
            padding: 0.6rem;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-input:focus {
            border-color: var(--primary);
        }

        .toggle-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            align-self: flex-end;
            margin-top: 1rem;
        }

        @media (min-width: 768px) {
            .toggle-switch-wrapper {
                margin-top: 0;
            }
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-color);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .toggle-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Vocab Grid & Cards */
        .vocab-list-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .subtopic-group-header {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .vocab-cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 640px) {
            .vocab-cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .vocab-cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Words styling */
        .vocab-mini-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vocab-mini-card:hover {
            transform: translateY(-2px);
            border-color: var(--text-secondary);
        }

        .mini-card-chinese {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .mini-card-english {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: right;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vocab-detail-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
        }

        .vocab-detail-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.05);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .detail-chinese-pinyin {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .detail-chinese {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .detail-pinyin {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 500;
        }

        .detail-english {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
            background-color: var(--bg-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .detail-meta-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .detail-meta-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-meta-value {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .detail-meta-value strong {
            color: var(--text-primary);
        }

        .speaker-icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .speaker-icon-btn:hover {
            color: var(--primary);
        }

        .mastery-checkbox {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
        }

        /* Flashcard Mode Styling */
        .flashcard-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
            justify-content: center;
        }

        .flashcard-settings {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.25rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .card-container {
            width: 100%;
            height: 380px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1.5rem;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .card-front {
            background-color: var(--surface-color);
        }

        .card-back {
            background-color: var(--surface-color);
            transform: rotateY(180deg);
            justify-content: space-between;
        }

        .card-front-chinese {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .card-front-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2rem;
            border: 1px dashed var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
        }

        .card-back-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-back-chinese-pinyin {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .card-back-chinese {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .card-back-pinyin {
            font-size: 1rem;
            color: var(--primary);
            font-weight: 500;
        }

        .card-back-english {
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--bg-color);
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
        }

        .card-back-details {
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem 0;
        }

        .card-back-detail-item {
            text-align: left;
            width: 100%;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .card-back-detail-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .card-back-detail-content {
            color: var(--text-secondary);
        }

        .card-back-footer {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .flashcard-actions {
            display: flex;
            width: 100%;
            gap: 1rem;
        }

        .flashcard-action-btn {
            flex: 1;
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: white;
            transition: transform 0.2s;
        }

        .flashcard-action-btn:hover {
            transform: translateY(-2px);
        }

        .btn-red {
            background-color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn-green {
            background-color: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .flashcard-nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 1rem;
        }

        .nav-arrow {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .nav-arrow:hover {
            background-color: var(--surface-hover);
        }

        /* Smart Quiz Mode */
        .quiz-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .quiz-progress-bar {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .quiz-progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        .quiz-question-type {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .quiz-question-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .quiz-options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .quiz-option-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            text-align: left;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .quiz-option-btn:hover {
            background-color: var(--surface-hover);
            border-color: var(--text-secondary);
        }

        .quiz-option-btn.correct {
            background-color: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #10b981;
        }

        .quiz-option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #ef4444;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Export Hub Styling */
        .export-hub-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .export-hub-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .export-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .export-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .export-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .export-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Drawer Overlay */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            backdrop-filter: blur(4px);
        }

        .drawer-content {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            max-width: 500px;
            width: 100%;
            border-radius: 1.5rem;
            padding: 2rem;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .drawer-content.shake {
            animation: shake 0.4s;
        }

        .drawer-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            display: none;
        }

        /* Keyboard hint badge */
        .kbd-badge {
            background-color: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            box-shadow: 0 1px 0 var(--border-color);
        }
    </style>
</head>

    <!-- App Logic -->
    <script>
        // Progress storage key
        const STORAGE_KEY = 'ib_vocab_mastery_tracker';
        let masteredWords = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        // Active state
        let currentThemeIndex = 0;
        let currentFlashcardIndex = 0;
        let activeFlashcards = [];
        
        // Quiz states
        let quizQuestions = [];
        let currentQuizIndex = 0;
        let quizScore = 0;
        let quizHistory = [];

        // App Initializer
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            // Register Keyboard Listeners
            document.addEventListener('keydown', (e) => {
                const activeView = document.querySelector('.view-section.active').id;
                if (activeView === 'flashcards-view') {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        flipCard();
                    } else if (e.code === 'ArrowLeft') {
                        prevFlashcard(e);
                    } else if (e.code === 'ArrowRight') {
                        nextFlashcard(e);
                    } else if (e.code === 'KeyM') {
                        markFlashcardMastered(e);
                    } else if (e.code === 'KeyR') {
                        markFlashcardReview(e);
                    }
                }
            });
        });

        function initApp() {
            renderDashboard();
            initFilters();
            filterVocab();
            initFlashcardsOptions();
            initFlashcards();
            renderExportHub();
            updateGlobalStats();
        }

        // Dark/Light Theme
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const targetTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', targetTheme);
            localStorage.setItem('app_theme', targetTheme);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);

        // Switch Navigation Views
        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            const viewMap = {
                'dashboard': 'dashboard-view',
                'browser': 'browser-view',
                'flashcards': 'flashcards-view',
                'quiz': 'quiz-view',
                'export': 'export-view'
            };

            document.getElementById(viewMap[viewName]).classList.add('active');
            
            // Find navigation button
            const navButtons = document.querySelectorAll('nav .nav-btn');
            if (viewName === 'dashboard') navButtons[0].classList.add('active');
            else if (viewName === 'browser') navButtons[1].classList.add('active');
            else if (viewName === 'flashcards') navButtons[2].classList.add('active');
            else if (viewName === 'quiz') {
                navButtons[3].classList.add('active');
                startQuizMode(); // Init fresh quiz
            }
            else if (viewName === 'export') navButtons[4].classList.add('active');

            // Update stats when returning to dashboard
            if (viewName === 'dashboard') {
                renderDashboard();
                updateGlobalStats();
            }
        }

        function updateGlobalStats() {
            let total = 750;
            let masteredCount = Object.keys(masteredWords).length;
            
            document.getElementById('global-total-words').textContent = total;
            document.getElementById('global-mastered-words').textContent = masteredCount;
            
            let rate = total > 0 ? Math.round((masteredCount / total) * 100) : 0;
            document.getElementById('global-mastery-rate').textContent = rate + '%';
        }

        // Save Word Mastery
        function toggleWordMastery(word, isMastered) {
            if (isMastered) {
                masteredWords[word] = true;
            } else {
                delete masteredWords[word];
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(masteredWords));
            updateGlobalStats();
        }

        // Render Dashboard Theme Cards
        function renderDashboard() {
            const grid = document.getElementById('themes-dashboard-grid');
            grid.innerHTML = '';
            
            vocabData.forEach((theme, index) => {
                // Count words and mastered
                let totalThemeWords = 0;
                let masteredThemeWords = 0;
                
                theme.subtopics.forEach(sub => {
                    sub.all_words.forEach(w => {
                        totalThemeWords++;
                        if (masteredWords[w.word]) masteredThemeWords++;
                    });
                });
                
                let pct = totalThemeWords > 0 ? Math.round((masteredThemeWords / totalThemeWords) * 100) : 0;
                
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.setAttribute('data-theme-idx', index);
                
                // Construct badges
                let subBadges = theme.subtopics.map(sub => `<span class="subtopic-badge" onclick="jumpToSubtopic(${index}, '${sub.title}')">📄 ${sub.title}</span>`).join('');

                card.innerHTML = `
                    <div class="theme-card-header">
                        <span class="theme-card-title">${theme.theme}</span>
                        <div class="theme-progress">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${pct}%;"></div>
                            </div>
                            <span>${masteredThemeWords}/${totalThemeWords} (${pct}%)</span>
                        </div>
                    </div>
                    <div class="theme-card-body">
                        <p class="theme-card-desc"><strong>万能模板句：</strong>${theme.templates[0] || '暂无描述'}</p>
                        <div class="theme-subtopics-list">
                            ${subBadges}
                        </div>
                    </div>
                    <div class="theme-card-footer">
                        <button class="btn btn-primary" onclick="startThemeFlashcards(${index})">🃏 卡片速记</button>
                        <button class="btn" onclick="startThemeQuiz(${index})">✍️ 主题自测</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function jumpToSubtopic(themeIdx, subTitle) {
            switchView('browser');
            document.getElementById('theme-filter').value = themeIdx;
            filterVocab();
            // Scroll to the subtopic header
            setTimeout(() => {
                const elements = document.getElementsByTagName('h3');
                for (let el of elements) {
                    if (el.textContent.includes(subTitle)) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.style.color = 'var(--primary)';
                        setTimeout(() => el.style.color = '', 2000);

        function startThemeQuiz(themeIdx) {

        // Filters initialization for Vocabulary Browser
        function initFilters() {
            const themeFilter = document.getElementById('theme-filter');

            vocabData.forEach((theme, index) => {

                themeFilter.appendChild(opt);

        // Render & Filter Vocabulary Browser
        function filterVocab() {
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const themeFilterVal = document.getElementById('theme-filter').value;
            const coreOnly = document.getElementById('core-only-toggle').checked;
            
            const container = document.getElementById('vocab-browser-list');
            container.innerHTML = '';
            
            vocabData.forEach((theme, themeIdx) => {
                // Filter by theme
                if (themeFilterVal !== 'all' && themeFilterVal != themeIdx) return;
                
                let themeHtml = '';
                
                theme.subtopics.forEach(sub => {
                    let filteredWords = [];
                    
                    if (coreOnly) {
                        // Core detailed words only
                        filteredWords = sub.core_words.filter(w => {
                            return w.word.includes(searchVal) || 
                                   w.pinyin.toLowerCase().includes(searchVal) || 
                                   w.meaning.toLowerCase().includes(searchVal);
                        });
                    } else {
                        // All 30 words
                        filteredWords = sub.all_words.filter(w => {
                            return w.word.includes(searchVal) || 
                                   w.meaning.toLowerCase().includes(searchVal);
                        });
                    }
                    
                    if (filteredWords.length === 0) return;
                    
                    let cardsHtml = '';
                    if (coreOnly) {
                        filteredWords.forEach(w => {
                            let checked = masteredWords[w.word] ? 'checked' : '';
                            cardsHtml += `
                                <div class="vocab-detail-card" onclick="openWordDrawer('${w.word.replace(/'/g, "\\'")}')">
                                    <div class="detail-header">
                                        <div class="detail-chinese-pinyin">
                                            <span class="detail-chinese">${w.word}</span>
                                            <span class="detail-pinyin">${w.pinyin}</span>
                                        </div>
                                        <span class="detail-english">${w.meaning}</span>
                                    </div>
                                    <div style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.4rem;">
                                        <span style="font-size:0.7rem; background-color:rgba(59,130,246,0.12); color:var(--primary); padding:0.15rem 0.35rem; border-radius:4px; font-weight:600;">替换：${w.replacement}</span>
                                        <span style="font-size:0.7rem; background-color:var(--border-color); color:var(--text-secondary); padding:0.15rem 0.35rem; border-radius:4px; font-weight:600;">文体：${w.text_type}</span>
                                    </div>
                                    <div class="detail-meta-group">
                                        <span class="detail-meta-title">常用搭配</span>
                                        <span class="detail-meta-value">${w.collocation}</span>
                                    </div>
                                    <div class="detail-meta-group">
                                        <span class="detail-meta-title">提分句式对比</span>
                                        <span class="detail-meta-value" style="font-size:0.8rem; display:flex; flex-direction:column; gap:0.25rem; background-color:var(--bg-color); padding:0.5rem; border-radius:4px;">
                                            <span style="color:#ef4444; font-weight:500;">❌ 低分：${w.before}</span>
                                            <span style="color:#10b981; font-weight:600;">✅ 高分：${w.after.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</span>
                                        </span>
                                    </div>
                                    <input type="checkbox" class="mastery-checkbox" ${checked} onclick="event.stopPropagation(); toggleWordMastery('${w.word.replace(/'/g, "\\'")}', this.checked)" title="标记为掌握">
                                </div>
                            `;
                        });
                    } else {
                        filteredWords.forEach(w => {
                            let checked = masteredWords[w.word] ? 'checked' : '';
                            let clickAction = `onclick="openWordDrawer('${w.word.replace(/'/g, "\\'")}')"`;
                            cardsHtml += `
                                <div class="vocab-mini-card" ${clickAction}>
                                    <span class="mini-card-chinese">
                                        <input type="checkbox" ${checked} onclick="event.stopPropagation(); toggleWordMastery('${w.word.replace(/'/g, "\\'")}', this.checked)" style="margin-right: 0.5rem; cursor: pointer;">
                                        ${w.word}
                                    </span>
                                    <span class="mini-card-english">${w.meaning}</span>
                                </div>
                            `;
                        });
                    }
                                        themeHtml += `
                        <h3 class="subtopic-group-header">📄 ${sub.title} (${filteredWords.length} 词)</h3>
                        <div class="vocab-cards-grid">
                            ${cardsHtml}
                        </div>
                    `;
                });
                
                if (themeHtml) {
                    const themeSection = document.createElement('div');
                    themeSection.style.marginBottom = '2.5rem';
                    themeSection.innerHTML = `
                        <h2 style="font-size: 1.35rem; font-weight:700; margin-bottom:1rem; border-left: 4px solid var(--primary); padding-left: 0.75rem;">${theme.theme}</h2>
                        ${themeHtml}
                    `;
                    container.appendChild(themeSection);
                }
            });
            
            if (container.innerHTML === '') {
                container.innerHTML = '<div style="text-align:center; padding: 3rem; color: var(--text-secondary);">没有找到符合条件的词汇</div>';
            }
        }

        // Helper to find word details
        function findWordDetails(word) {
            for (const theme of vocabData) {
                for (const sub of theme.subtopics) {
                    const coreMatch = sub.core_words.find(cw => cw.word === word);
                    if (coreMatch) return { type: 'core', ...coreMatch };
                    const simpleMatch = sub.all_words.find(aw => aw.word === word);
                    if (simpleMatch) return { type: 'simple', ...simpleMatch };
                }
            }
            return null;
        }

        // Modal drawers
        let drawerActiveWord = "";
        function openWordDrawer(word) {
            const details = findWordDetails(word);
            if (!details) return;

            drawerActiveWord = word;
            document.getElementById('drawer-chinese').textContent = word;

            if (details.type === 'core') {
                document.getElementById('drawer-pinyin').textContent = details.pinyin;
                document.getElementById('drawer-english').textContent = details.meaning;
                document.getElementById('drawer-collocation').textContent = details.collocation;
                
                let richHtml = '';
                if (details.replacement && details.before && details.after) {
                    richHtml = `
                        <div style="margin-bottom:0.75rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                            <span style="font-size:0.8rem; background-color:rgba(59,130,246,0.15); color:var(--primary); padding:0.2rem 0.5rem; border-radius:4px; font-weight:600;">近义替换：${details.replacement}</span>
                            <span style="font-size:0.8rem; background-color:var(--border-color); color:var(--text-secondary); padding:0.2rem 0.5rem; border-radius:4px; font-weight:600;">最适文体：${details.text_type}</span>
                        </div>
                        <div style="font-size:0.9rem; display:flex; flex-direction:column; gap:0.4rem; padding:0.75rem; background-color:var(--bg-color); border-radius:0.5rem; border-left:3px solid var(--primary); margin-top:0.5rem;">
                            <span style="color:#ef4444; font-weight:500;">❌ 普通大白话句：${details.before}</span>
                            <span style="color:#10b981; font-weight:600;">✅ 高分升级表达：${details.after.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</span>
                        </div>
                    `;
                } else {
                    richHtml = details.example.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                }
                document.getElementById('drawer-example').innerHTML = richHtml;
            } else {
                document.getElementById('drawer-pinyin').textContent = "";
                document.getElementById('drawer-english').textContent = details.meaning;
                document.getElementById('drawer-collocation').textContent = "无精讲搭配";
                document.getElementById('drawer-example').textContent = "该词汇为基础分类词汇，暂无精讲考场例句。建议结合上下文或Quizlet导入查阅。";
            }
            
            const isMastered = masteredWords[word] || false;
            const btn = document.getElementById('drawer-master-btn');
            if (isMastered) {
                btn.textContent = '💚 已掌握（点击取消）';
                btn.className = 'btn btn-primary';
                btn.style.backgroundColor = '#10b981';
            } else {
                btn.textContent = '标记为熟练掌握';
                btn.className = 'btn';
                btn.style.backgroundColor = '';
            }
            
            document.getElementById('word-detail-drawer').style.display = 'flex';
        }

        function openSimpleWord(word, meaning) {
            openWordDrawer(word);
        }
                function closeWordDrawer(e) {
            document.getElementById('word-detail-drawer').style.display = 'none';
        }

        function toggleDrawerWordMastery() {
            const isMastered = masteredWords[drawerActiveWord] || false;
            toggleWordMastery(drawerActiveWord, !isMastered);
            
            // Re-render browser to update checkboxes
            filterVocab();
            closeWordDrawer();
        }

        // Voice speech synthesis
        function speakCurrentWord(e) {
            if (e) e.stopPropagation();
            let text = document.getElementById('card-front-chinese').textContent;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancel any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.85; // slightly slower for language learners
                
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('ZH'));
                if (zhVoice) utterance.voice = zhVoice;
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert("抱歉，您的浏览器不支持语音朗读功能。");
            }
        }

        // Flashcards logic
        function initFlashcardsOptions() {
            const select = document.getElementById('flashcard-theme-select');
            select.innerHTML = '<option value="all">精选 Criterion A 核心精讲词 (75词)</option>';
            
            vocabData.forEach((theme, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = theme.theme.replace(/^[🟢🟡🔵🟠🟤]\s+/, '');
                select.appendChild(opt);
            });
        }

        function initFlashcards() {
            const themeIdx = document.getElementById('flashcard-theme-select').value;
            activeFlashcards = [];
            
            if (themeIdx === 'all') {
                // Collect core words from all subtopics
                vocabData.forEach(theme => {
                    theme.subtopics.forEach(sub => {
                        sub.core_words.forEach(cw => {
                            activeFlashcards.push(cw);
                        });
                    });
                });
            } else {
                // Collect core words from selected theme
                vocabData[themeIdx].subtopics.forEach(sub => {
                    sub.core_words.forEach(cw => {
                        activeFlashcards.push(cw);
                    });
                });
            }

            // Shuffle array
            activeFlashcards.sort(() => Math.random() - 0.5);
            
            currentFlashcardIndex = 0;
            showFlashcard();
        }

        function showFlashcard() {
            if (activeFlashcards.length === 0) {
                document.getElementById('card-front-chinese').textContent = "无卡片";
                return;
            }
            
            // Unflip card
            document.getElementById('flashcard-inner').classList.remove('flipped');
            
            const card = activeFlashcards[currentFlashcardIndex];
            
            setTimeout(() => {
                document.getElementById('card-front-chinese').textContent = card.word;
                document.getElementById('card-back-chinese').textContent = card.word;
                document.getElementById('card-back-pinyin').textContent = card.pinyin;
                document.getElementById('card-back-english').textContent = card.meaning;
                
                // If it is a core word, we show rich layout
                const details = findWordDetails(card.word);
                if (details && details.type === 'core') {
                    document.getElementById('card-back-collocation').textContent = `${details.collocation} | 推荐文体: [${details.text_type}]`;
                    document.getElementById('card-back-example').innerHTML = `
                        <span style="color:var(--text-muted); font-size:0.75rem; font-weight:700; text-transform:uppercase; display:block; margin-bottom:0.15rem;">近义替换: ${details.replacement}</span>
                        <span style="color:#ef4444; display:block; margin-bottom:0.1rem;">❌ 低分：${details.before}</span>
                        <span style="color:#10b981; font-weight:600; display:block;">✅ 高分：${details.after.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</span>
                    `;
                } else {
                    document.getElementById('card-back-collocation').textContent = "无精讲搭配";
                    document.getElementById('card-back-example').textContent = "该词汇为基础分类词汇，暂无精讲考场例句。建议结合上下文或Quizlet导入查阅。";
                }
                
                document.getElementById('flashcard-progress-text').textContent = `${currentFlashcardIndex + 1} / ${activeFlashcards.length}`;
            }, 150);
        }

                function flipCard() {
            document.getElementById('flashcard-inner').classList.toggle('flipped');
        }

        function prevFlashcard(e) {
            if (e) e.stopPropagation();
            if (currentFlashcardIndex > 0) {
                currentFlashcardIndex--;
                showFlashcard();
            }
        }

        function nextFlashcard(e) {
            if (e) e.stopPropagation();
            if (currentFlashcardIndex < activeFlashcards.length - 1) {
                currentFlashcardIndex++;
                showFlashcard();
            }
        }

        // Smart Quiz Mode
        function startQuizMode(themeIdx = 'all') {
            quizQuestions = [];
            currentQuizIndex = 0;
            quizScore = 0;
            quizHistory = [];
            
            // 1. Gather all words for potential answers
            let allPool = [];
            let corePool = [];
            
            vocabData.forEach((theme, index) => {
                if (themeIdx !== 'all' && themeIdx != index) return;
                
                theme.subtopics.forEach(sub => {
                    sub.all_words.forEach(w => allPool.push(w));
                    sub.core_words.forEach(cw => corePool.push(cw));
                });
            });

            if (corePool.length < 4) {
                corePool = [...allPool];
            }

            // 2. Build 10 questions
            let shuffledCore = [...corePool].sort(() => Math.random() - 0.5);
            let quizLen = Math.min(10, shuffledCore.length);
            
            for (let i = 0; i < quizLen; i++) {
                const target = shuffledCore[i];
                
                let type = Math.floor(Math.random() * 2);
                if (target.example && target.example !== "暂无" && type === 1) {
                    type = 2;
                }

                let qText = '';
                let qTypeLabel = '';
                let correctOpt = '';
                let options = [];

                if (type === 0) {
                    qTypeLabel = '词义选择 (英译中)';
                    qText = `请选择词语 “<strong>${target.word}</strong>” 的正确英文释义：`;
                    correctOpt = target.meaning;
                    
                    let wrongPool = allPool.filter(w => w.word !== target.word).sort(() => Math.random() - 0.5);
                    options = [correctOpt, wrongPool[0].meaning, wrongPool[1].meaning, wrongPool[2].meaning];
                } else if (type === 1) {
                    qTypeLabel = '词义选择 (中译英)';
                    qText = `哪个词语的意思是 “<strong>${target.meaning}</strong>”？`;
                    correctOpt = target.word;
                    
                    let wrongPool = allPool.filter(w => w.word !== target.word).sort(() => Math.random() - 0.5);
                    options = [correctOpt, wrongPool[0].word, wrongPool[1].word, wrongPool[2].word];
                } else {
                    qTypeLabel = '句子填空 (Context Fit)';
                    let rawSentence = (target.after || target.example || '').replace(new RegExp(target.word, 'g'), ' ______ ');
                    let sentence = rawSentence.replace(/\*\*(.*?)\*\*/g, '$1');
                    qText = `请选出最适合填入括号中的词语：<br><br><div style="font-style: italic; color: var(--text-secondary); background-color: var(--bg-color); padding: 1rem; border-radius: 0.5rem; border-left: 3px solid var(--primary);">${sentence}</div>`;
                    correctOpt = target.word;
                    
                    let wrongPool = allPool.filter(w => w.word !== target.word).sort(() => Math.random() - 0.5);
                    options = [correctOpt, wrongPool[0].word, wrongPool[1].word, wrongPool[2].word];                }

                options.sort(() => Math.random() - 0.5);

                quizQuestions.push({
                    qTypeLabel,
                    qText,
                    correctOpt,
                    options,
                    targetWord: target.word
                });
            }

            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const box = document.getElementById('quiz-box');
            
            if (quizQuestions.length === 0) {
                box.innerHTML = '<div style="text-align:center; padding: 2rem;">词汇库数据不足，无法生成测试。</div>';
                return;
            }

            if (currentQuizIndex >= quizQuestions.length) {
                renderQuizResults();
                return;
            }

            const pct = Math.round((currentQuizIndex / quizQuestions.length) * 100);
            const q = quizQuestions[currentQuizIndex];

            let optionsHtml = q.options.map(opt => `
                <button class="quiz-option-btn" onclick="submitQuizAnswer(this, '${opt.replace(/'/g, "\'")}', '${q.correctOpt.replace(/'/g, "\'")}')">${opt}</button>
            `).join('');

            box.innerHTML = `
                <div class="quiz-progress-bar">
                    <div class="quiz-progress-fill" style="width: ${pct}%;"></div>
                </div>
                <div class="detail-header" style="justify-content: space-between;">
                    <span class="quiz-question-type">${q.qTypeLabel}</span>
                    <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">第 ${currentQuizIndex + 1} / ${quizQuestions.length} 题</span>
                </div>
                <p class="quiz-question-text">${q.qText}</p>
                <div class="quiz-options-list">
                    ${optionsHtml}
                </div>
            `;
        }

        function submitQuizAnswer(btn, selected, correct) {
            document.querySelectorAll('.quiz-option-btn').forEach(b => b.removeAttribute('onclick'));

            const isCorrect = (selected === correct);
            if (isCorrect) {
                btn.classList.add('correct');
                quizScore++;
                const q = quizQuestions[currentQuizIndex];
                toggleWordMastery(q.targetWord, true);
            } else {
                btn.classList.add('incorrect');
                document.querySelectorAll('.quiz-option-btn').forEach(b => {
                    if (b.textContent === correct) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentQuizIndex++;
                renderQuizQuestion();
            }, 1500);
        }

        function renderQuizResults() {
            const box = document.getElementById('quiz-box');
            
            box.innerHTML = `
                <div style="text-align: center; display: flex; flex-direction: column; gap: 1.5rem; padding: 1rem 0;">
                    <span style="font-size: 5rem;">🏆</span>
                    <h2 style="font-size: 1.8rem; font-weight: 700;">测试已完成！</h2>
                    <p style="font-size: 1.1rem; color: var(--text-secondary);">您的得分是：<strong style="color: var(--primary); font-size: 2rem;">${quizScore}</strong> / ${quizQuestions.length}</p>
                    <p style="font-size: 0.9rem; color: var(--text-muted);">答对的核心词汇已被自动标记为“已掌握”。</p>
                    <div style="margin-top: 1rem; display: flex; gap: 1rem;">
                        <button class="btn btn-primary" onclick="startQuizMode()">🔄 再考一次</button>
                        <button class="btn" onclick="switchView('dashboard')">📊 返回仪表盘</button>
                    </div>
                </div>
            `;
            
            if (quizScore >= 8) {
                triggerConfetti();
            }
        }

        // Confetti
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            let particles = [];
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#f97316'];
            
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * canvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
            }
            
            let animationFrameId;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let remaining = false;
                
                particles.forEach((p, idx) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle);
                    p.tilt = Math.sin(p.tiltAngle - idx / 3) * 15;
                    
                    if (p.y < canvas.height) remaining = true;
                    
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();
                });
                
                if (remaining) {
                    animationFrameId = requestAnimationFrame(draw);
                } else {
                    canvas.style.display = 'none';
                }
            }
            
            draw();
            setTimeout(() => {
                cancelAnimationFrame(animationFrameId);
                canvas.style.display = 'none';
            }, 5000);
        }

        // Render Export Hub List
        function renderExportHub() {
            const container = document.getElementById('export-hub-grid');
            container.innerHTML = '';
            
            vocabData.forEach((theme, themeIdx) => {
                theme.subtopics.forEach((sub, subIdx) => {
                    const card = document.createElement('div');
                    card.className = 'export-card';
                    
                    let copyText = sub.all_words.map(w => `${w.word} | ${w.meaning}`).join('\n');

                    card.innerHTML = `
                        <div class="export-info">
                            <span class="export-title">${sub.title}</span>
                            <span class="export-desc">共 30 个词汇/短语</span>
                        </div>
                        <button class="btn" style="flex: 0 0 auto;" onclick="copyExportText('${copyText.replace(/'/g, "\'")}', this)">📋 复制 Quizlet 格式</button>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function copyExportText(text, btn) {
            navigator.clipboard.writeText(text.replace(/\n/g, '\n')).then(() => {
                const oldText = btn.textContent;
                btn.textContent = '✅ 已成功复制！';
                btn.style.backgroundColor = '#10b981';
                btn.style.color = 'white';
                setTimeout(() => {
                    btn.textContent = oldText;
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(err => {
                alert("复制失败，请手动选择复制。");
            });
        }
    </script>
